{% extends "layout/default.html" %}

{% block main_content %}
<link rel="stylesheet" href="/static/css/bootstrap-datepicker3.min.css" />
<link rel="stylesheet" href="/static/css/tabulator.min.css" type="text/css"/>
<script src="/static/js/xlsx.full.min.js" type="text/javascript"></script>
<script src="/static/js/tabulator.min.js" type="text/javascript"></script>
<script src="/static/js/bootstrap-datepicker.min.js"></script>
<script src="/static/js/bootstrap-datepicker.zh-CN.min.js"></script>
<div style="height: 100%;overflow: hidden;">
        <div class="table-header" style="width:100%;height:35px;">
            <div style="display:inline-block;float:left;height:100%;">
                <div style="display:inline-block;float:left;text-overflow:ellipsis;white-space:nowrap;">
                    {{ web_module_data.name }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;日期：
                </div>
                <div style="display:inline-block;float:right;">
                    <input type="hidden" id="dateid_old">
                    <input type="text" value="{{ date_now }}" id="dateid" class="input-group-sm form-control date-picker">
                </div>
            </div>
            <div style="display:inline-block;float:right;height:100%;">
                <input type="button" id="resetFilter" value="重置筛选" style="background-color:#307ECC;height:100%;">
                <input type="button" id="saveExcel" value="保存Excel" style="background-color:#307ECC;height:100%;">
            </div>
        </div>
        <div id="instock-hint" style="display:none;padding:6px 10px;font-size:12px;margin:4px 0;border-radius:3px;"></div>
        <div id="instock-data" style="width:100%;height:calc(100% - 95px);"></div>
        <div id="statusBar" style="width:100%;height:20px;padding:2px 4px;font-size:12px;color:#666;"></div>
</div>

<script type="text/javascript">
    const nameParam = $.getUrlVar('table_name');
    let dateParam = "{{ date_now }}";
    const colInfos = {% raw web_module_data.column_names %};
    let instockTable = null;
    let currentRowIndex = 0;

    function apiUrl() {
        return "/instock/api_data?name=" + encodeURIComponent(nameParam) + "&date=" + encodeURIComponent(dateParam);
    }

    /** 仅页面提示条，不用弹窗。kind: info | warn | error | clear */
    function setHint(msg, kind) {
        var el = document.getElementById("instock-hint");
        if (!msg || kind === "clear") {
            el.style.display = "none";
            el.textContent = "";
            return;
        }
        el.style.display = "block";
        el.textContent = msg;
        if (kind === "error") {
            el.style.color = "#b40000";
            el.style.background = "#ffebee";
            el.style.border = "1px solid #ffcdd2";
        } else if (kind === "warn") {
            el.style.color = "#8a5a00";
            el.style.background = "#fff8e6";
            el.style.border = "1px solid #ffe0a3";
        } else {
            el.style.color = "#444";
            el.style.background = "#f0f4f8";
            el.style.border = "1px solid #dde4ec";
        }
    }

    function formatRowDate(row) {
        if (!row || row.date == null) return "";
        if (typeof row.date === "string") return row.date.split("T")[0];
        return String(row.date);
    }

    function buildColumns() {
        return colInfos.map(function (c, idx) {
            var col = {
                field: c.value,
                title: c.caption,
                width: c.width || 80,
                minWidth: 60,
                headerFilter: "input",
                headerFilterPlaceholder: "筛选",
            };
            if (idx < 3) {
                col.frozen = true;
            }
            if (c.value === "change_rate") {
                col.formatter = function (cell) {
                    var v = cell.getValue();
                    var el = document.createElement("span");
                    if (v == null || v === "") { el.textContent = ""; return el; }
                    var n = parseFloat(v);
                    if (n > 0) el.style.color = "red";
                    else if (n < 0) el.style.color = "green";
                    el.textContent = v;
                    return el;
                };
            } else if (c.value === "code") {
                col.formatter = function (cell) {
                    var row = cell.getRow().getData();
                    var code = String(row.code || "").trim();
                    var a = document.createElement("a");
                    a.textContent = cell.getValue() == null ? "" : cell.getValue();
                    var cn = code.charAt(0) === "6" ? "SH" + code : "SZ" + code;
                    a.href = code ? "https://quote.eastmoney.com/" + cn + ".html" : "#";
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.title = "打开东方财富行情；Ctrl/⌘+点击进本系统指标页";
                    a.onclick = function (ev) {
                        if (ev.ctrlKey || ev.metaKey) {
                            ev.preventDefault();
                            window.open(
                                "/instock/data/indicators?code=" + encodeURIComponent(code) +
                                "&date=" + encodeURIComponent(formatRowDate(row)) +
                                "&name=" + encodeURIComponent(row.name || ""),
                                "_blank"
                            );
                        }
                    };
                    return a;
                };
            }
            return col;
        });
    }

    function updateStatusBar() {
        if (!instockTable) return;
        var el = document.getElementById("statusBar");
        var total = instockTable.getData().length;
        var shown = total;
        try {
            if (typeof instockTable.getRows === "function") {
                var r = instockTable.getRows("active");
                if (r && r.length !== undefined) shown = r.length;
            }
        } catch (ignore) { shown = total; }
        el.innerHTML = "<i class=\"fa fa-commenting-o\"></i> 总记录/筛选记录：<b>" + total + "</b> / <b>" + shown + "</b> 条 — 当前位置：第 <b>" + (currentRowIndex || 0) + "</b> 行";
    }

    function loadOrReloadTable() {
        var old = document.getElementById("dateid_old").value;
        dateParam = document.getElementById("dateid").value;
        if (old === dateParam && instockTable) return;
        document.getElementById("dateid_old").value = dateParam;
        setHint("", "clear");

        if (instockTable) {
            instockTable.destroy();
            instockTable = null;
        }

        instockTable = new Tabulator("#instock-data", {
            layout: "fitDataFill",
            height: "100%",
            placeholder: "暂无数据",
            columns: buildColumns(),
            ajaxRequestFunc: function (url, config, params) {
                return fetch(url, { credentials: "same-origin" }).then(function (res) {
                    return res.text().then(function (text) {
                        if (res.status === 404) {
                            try {
                                var j = JSON.parse(text);
                                setHint((j && j.error) ? j.error : "请求的资源不存在。", "warn");
                            } catch (e) {
                                setHint("数据表尚未就绪或路径不正确，请在左侧「数据同步」运行对应作业后再试。", "warn");
                            }
                            return [];
                        }
                        if (!res.ok) {
                            setHint("加载失败（HTTP " + res.status + "）。请稍后再试或查看 instock/log/stock_web.log。", "error");
                            return [];
                        }
                        try {
                            var data = JSON.parse(text);
                            if (!Array.isArray(data)) {
                                setHint("接口返回格式异常，无法展示为表格。", "error");
                                return [];
                            }
                            if (data.length === 0) {
                                setHint("当前所选日期暂无数据。若为交易日，可在「数据同步」运行对应抓取作业，或尝试其他日期。（空表不是系统故障）", "info");
                            } else {
                                setHint("", "clear");
                            }
                            return data;
                        } catch (e) {
                            setHint("解析接口数据失败。", "error");
                            return [];
                        }
                    });
                }).catch(function () {
                    setHint("网络异常，无法连接本服务。", "error");
                    return [];
                });
            },
            ajaxURL: apiUrl(),
            ajaxConfig: "GET",
        });

        instockTable.on("dataLoaded", function () {
            updateStatusBar();
        });
        instockTable.on("dataFiltered", function () {
            updateStatusBar();
        });
        instockTable.on("rowClick", function (e, row) {
            try {
                var rows = instockTable.getRows("active");
                var i = rows.indexOf(row);
                currentRowIndex = i >= 0 ? i + 1 : 0;
            } catch (ignore) {
                currentRowIndex = 0;
            }
            updateStatusBar();
        });
    }

    $(document).ready(function () {
        loadOrReloadTable();

        var elem = document.querySelector("#instock-data");
        if (elem && window.ResizeObserver) {
            var prev = 0;
            new ResizeObserver(function (changes) {
                for (var i = 0; i < changes.length; i++) {
                    var w = changes[i].contentRect.width;
                    if (w === prev) return;
                    prev = w;
                    if (instockTable) instockTable.redraw(true);
                }
            }).observe(elem);
        }

        $(".date-picker").datepicker({
            language: "zh-CN",
            format: "yyyy-mm-dd",
            showOtherMonths: true,
            selectOtherMonths: false,
            autoclose: true,
            todayHighlight: true,
        }).on("changeDate", function () {
            loadOrReloadTable();
        });
    });

    document.getElementById("saveExcel").onclick = function () {
        if (!instockTable) return;
        try {
            if (typeof XLSX !== "undefined") {
                instockTable.download("xlsx", nameParam + "_" + dateParam + ".xlsx", { sheetName: nameParam });
            } else {
                instockTable.download("csv", nameParam + "_" + dateParam + ".csv");
            }
        } catch (err) {
            console.error(err);
            try {
                instockTable.download("csv", nameParam + "_" + dateParam + ".csv");
            } catch (e2) {
                setHint("导出失败，请使用浏览器或稍后再试。", "warn");
            }
        }
    };

    document.getElementById("resetFilter").onclick = function () {
        if (!instockTable) return;
        instockTable.clearHeaderFilter();
        updateStatusBar();
    };
</script>
{% end %}
