# 开发用：挂载本机仓库代码（与 部署说明.md §3.5.1 一致）
#
# 使用：在 docker/ 目录下
#   export INSTOCK_REPO_ROOT=/你的绝对路径/instock   # 含 requirements.txt 与 instock/ 子目录的仓库根
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 首次克隆后宿主机需：chmod +x instock/bin/run_web.sh instock/bin/run_job.sh instock/bin/run_cron.sh

services:
  instock:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 宿主机需运行: python3 scripts/host_ops_server.py
      INSTOCK_HOST_OPS_URL: ${INSTOCK_HOST_OPS_URL:-http://host.docker.internal:19888}
    volumes:
      - ${INSTOCK_REPO_ROOT:?请设置环境变量 INSTOCK_REPO_ROOT 为仓库根绝对路径}:/data/InStock
